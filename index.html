<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Protect Arcadia's Native Oaks</title>

  <!-- Favicon: ✲ U+2732 -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✲</text></svg>">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 50px 20px;
      max-width: 650px;
      margin: auto;
      line-height: 1.5;
      color: #222;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 24px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    .small {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>

</head>

<body>

  <h1>Protect Arcadia's Native Oaks</h1>

  <p>
    Your email app should open automatically with a pre-written email.
  </p>

  <p>
    <strong>Please add your name and city before sending.</strong>
  </p>

  <a id="emailButton" class="button" href="#">
    Open Email
  </a>

  <p class="small">
    If your email does not open automatically, tap the button above.
    You can edit or personalize the message before sending.
  </p>


<script>

const to = "fgraham@ArcadiaCA.gov";

const cc = [
  "pcheng@ArcadiaCA.gov",
  "dfu@ArcadiaCA.gov",
  "skwan1@ArcadiaCA.gov",
  "domlazz@ArcadiaCA.gov",
  "PETE.SIBERELL@santaanita.com",
  "bdale@la28.org"
].join(",");

const subject =
  "Please Deny TRH 26-11 and TRE 26-09 and Protect Arcadia's Native Oaks";

const body = `Dear Ms. Graham, Mayor Cheng, Mayor Pro Tem Fu, Councilmember Kwan, City Manager Lazzaretto, Mr. Siberell and Ms. Dale:

I am writing to urge the City of Arcadia to protect the native oaks threatened by the proposed LA28 equestrian cross-country course at Santa Anita Park.

The applicant’s own arborist report recognizes these trees as protected oaks of continuing regulatory and arboricultural value. Arcadia’s rules require the applicant to demonstrate why removal is necessary and why it is preferable to alternative project designs. The City should require redesign and not simply accept the applicant's current design and extensive tree removals.

Removing mature native oaks for the Olympics also conflicts with LA28’s environmental commitments to minimize environmental impacts and protect and restore nature. Sustainability cannot mean restoring nature in one place while unnecessarily destroying established native habitat in another.

The Olympics are in town for only a moment. These trees have been part of Arcadia for generations. If they are removed, that loss is permanent.

I therefore respectfully request that the City:

1. Deny TRH 26-11 and TRE 26-09 at the earliest available administrative stage;
2. Require the applicant to undertake a further tree-preserving redesign of the cross-country course, including alternative alignments, obstacle locations, grading configurations, and construction methods;
3. Reconsider whether reliance on categorical exemptions from CEQA is appropriate given the scale of the proposed impacts to protected native trees; and
4. Ensure meaningful public review and an opportunity for public participation before any decision authorizing tree removal or significant encroachment becomes final.

There is substantial public concern about these trees. If the permits continue through the approval process, we intend to participate at every available stage and challenge the proposed removals and encroachments through every applicable administrative and legal avenue. We would much rather see this resolved now through thoughtful redesign.

I am also copying Becky Dale, LA28 Vice President of Sustainability, given LA28's commitments to minimize environmental impacts and protect and restore nature.

Hosting the Olympic Games should be a source of pride for our region, not shame for killing valuable trees. Please make preservation of these oaks a fundamental requirement of the course design.

Sincerely,

[Name]
[City, State, ZIP]`;


const emailLink =
  "mailto:" + to +
  "?cc=" + encodeURIComponent(cc) +
  "&subject=" + encodeURIComponent(subject) +
  "&body=" + encodeURIComponent(body);


/* Make the button open the email */
document.getElementById("emailButton").href = emailLink;


/* Automatically attempt to open the email app */
window.addEventListener("load", function () {
  setTimeout(function () {
    window.location.href = emailLink;
  }, 600);
});

</script>

</body>
</html>
